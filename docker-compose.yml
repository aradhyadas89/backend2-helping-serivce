version: '3.8'

services:
  sub-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helping-services-sub-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=production
      - PORT=8001
      - HOST=0.0.0.0
      - MAIN_BACKEND_URL=http://host.docker.internal:8000
      - ADMIN_SUB_BACKEND_SECRET=helping-services-admin-sub-backend-secret-2026
      - ANALYSIS_ENGINE_SECRET=helping-services-analysis-engine-secret-2026
      - JWT_SECRET=helping-services-jwt-super-secret-key-2026
      - MONGODB_ANALYTICS_URL=${MONGODB_ANALYTICS_URL}
      - MONGODB_CORE_URL=${MONGODB_CORE_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"

